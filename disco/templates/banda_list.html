{% extends 'base.html' %}

{% block conteudo %}
<br>
<a href="{% url 'musica:banda_new' %}" class="btn btn-primary mb-3">Novo</a>

<table class="table table-striped table-hover">

    <thead class="table-dark">
        <tr>
            <td>ID</td>
            <td>Banda</td>
        </tr>
    </thead>
    {% for banda in bandas %}
    <tr>
        <td>{{ banda.id }}</td>
        <td><a href="{% url 'musica:banda_detail' banda.id %}">{{ banda.nome }}</a></td>
        
    
        <td><a href="{% url 'musica:banda_edit' banda.id %}" class="btn btn-secundary btn-sm">Alterar</a></td>
        <td><a href="{% url 'musica:banda_delete' banda.id %}" class="btn btn-danger btn-sm">Deletar</a></td>
    </tr>
    {% endfor %}
</table>
   
{% endblock %}
