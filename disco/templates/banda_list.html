{% extends 'base.html' %}

{% block conteudo %}
<br>
<a href="{% url 'musica:banda_new' %}">Novo</a>

<table>
    <tr>
        <td>ID</td>
        <td>Banda</td>
    </tr>
    {% for banda in bandas %}
    <tr>
        <td>{{ banda.id }}</td>
        <td><a href="{% url 'musica:banda_detail' banda.id %}">{{ banda.nome }}</a></td>
        
    
        <td><a href="{% url 'musica:banda_edit' banda.id %}">Alterar</a></td>
        <td><a href="{% url 'musica:banda_delete' banda.id %}">Deletar</a></td>
    </tr>
    {% endfor %}
</table>
   
{% endblock %}
