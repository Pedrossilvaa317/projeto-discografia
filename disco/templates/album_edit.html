{% extends 'base.html' %}

{% block conteudo %}
  <h3>Edição de Álbum</h3>
  <hr>

  <form action="" method="post" enctype="multipart/form-data">
      {% csrf_token %}

      <div class="mb-3">
        <label for="{{ form.titulo.id_for_label }}" class="form-label">Título</label>
        {{ form.titulo }}
      </div>

      <div class="mb-3">
        <label for="{{ form.banda.id_for_label }}" class="form-label">Banda</label>
        {{ form.banda }}
      </div>
      
      <div class="mb-3">
        <label for="{{ form.data.id_for_label }}" class="form-label">Data de Lançamento</label>
        {{ form.data }}
      </div>

      <div class="mb-3">
        <label for="{{ form.capa.id_for_label }}" class="form-label">Capa do Álbum</label>
        {{ form.capa }}
      </div>

      <button type="submit" class="btn btn-primary">Salvar</button>
  </form>
{% endblock %}
