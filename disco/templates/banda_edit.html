{% extends 'base.html' %}

{% block conteudo %}
  <h3>Edição de Banda</h3>
  <hr>

  <form action="" method="post">
      {% csrf_token %}

      <div class="mb-3">
        <label for="{{ form.nome.id_for_label }}" class="form-label">Nome da Banda</label>
        {{ form.nome }}
      </div>

      <button type="submit" class="btn btn-primary">Salvar</button>
  </form>
{% endblock %}
