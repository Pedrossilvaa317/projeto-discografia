{% extends 'base.html' %}

{% block conteudo %}
<br>
<a href="{% url 'musica:musica_new' %}" class="btn btn-primary mb-3">Novo</a>

<table class="table table-striped table-hover">
    <thead class="table-dark">
        <tr>
            <td>ID</td>
            <td>Titulo</td>
            <td>Segundos</td>
            <td>Artista</td>
            <td>Álbum</td>
        </tr>
    </thead>
    {% for musica in musicas %}
    <tr>
        <td>{{ musica.id }}</td>
        <td>{{ musica.titulo }}</td>
        <td>{{ musica.segundos }}</td>
        <td>{{ musica.album.banda.nome }}</td>
        <td>{{ musica.album }}</td>
    
        <td><a href="{% url 'musica:musica_edit' musica.id %}" class="btn btn-secundary btn-sm">Alterar</a></td>
        <td><a href="{% url 'musica:musica_delete' musica.id %}" class="btn btn-danger btn-sm">Deletar</a></td>
    </tr>
    {% endfor %}
</table>
   
{% endblock %}
